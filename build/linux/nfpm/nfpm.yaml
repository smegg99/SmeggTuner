# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "smeggtuner"
# Package target is independent of the host architecture running the Go tool.
arch: ${PACKAGE_ARCH}
platform: "linux"
version: "${VERSION}"
section: "default"
priority: "extra"
maintainer: "Smegg99"
description: "Free and open-source accordion tuner."
vendor: "Smegg99"
homepage: "https://smeggtuner.com"
license: "MIT"
release: "1"

contents:
  - src: "./bin/smeggtuner"
    dst: "/usr/local/bin/smeggtuner"
  - src: "./assets/smeggtuner-app-icon.svg"
    dst: "/usr/share/icons/hicolor/scalable/apps/smeggtuner.svg"
  - src: "./build/linux/smeggtuner.desktop"
    dst: "/usr/share/applications/smeggtuner.desktop"

# Default dependencies for Debian 12/Ubuntu 22.04+ with WebKit 4.1
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0

# Distribution-specific overrides for different package formats and WebKit versions
overrides:
  # RPM distributions name these packages differently (Fedora webkit2gtk4.1, openSUSE
  # libwebkit2gtk-4_1-0); every one provides the libraries by soname.
  rpm:
    depends:
      - libgtk-3.so.0()(64bit)
      - libwebkit2gtk-4.1.so.0()(64bit)
  
  # Arch Linux packages (WebKit 4.1)  
  archlinux:
    depends:
      - gtk3
      - webkit2gtk-4.1

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

