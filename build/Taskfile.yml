version: '3'

tasks:
  generate:locales:
    summary: Generate native and frontend locale catalogs
    cmds:
      - go tool loc build -c i18n/config.cue

  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Install frontend dependencies
    dir: frontend
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules
    preconditions:
      - sh: pnpm --version
        msg: "Looks like pnpm isn't installed. Install it via: npm install -g pnpm"
    cmds:
      - pnpm install

  build:frontend:
    label: build:frontend (DEV={{.DEV}})
    summary: Build the frontend project
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
    generates:
      - ../backend/frontend/public/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
    cmds:
      - pnpm run generate
      - rm -rf ../backend/frontend/public
      - mkdir -p ../backend/frontend/public
      - cp -a .output/public/. ../backend/frontend/public/
    env:
      PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'

  generate:bindings:
    label: generate:bindings (BUILD_FLAGS={{.BUILD_FLAGS}})
    summary: Generates bindings for the frontend
    deps:
      - task: go:mod:tidy
      - task: generate:locales
    sources:
      - "**/*.[jt]s"
      - exclude: frontend/**/*
      - frontend/bindings/**/*  # Rerun when switching between dev/production mode causes changes in output
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
      - frontend/app/composables/s99wails/**/*
    cmds:
      - mkdir -p backend/frontend/public
      - touch backend/frontend/public/.keep
      - go tool frontendgen -out frontend/app/composables/s99wails -s99ab
      - go tool wails3 generate bindings -f '{{.BUILD_FLAGS}}' -clean=true -ts -d frontend/bindings ./backend

  generate:icons:
    summary: Renders appicon.png from assets/smeggtuner-app-icon.svg, then Windows `.ico` and Mac `.icns` from it; on macOS, `-iconcomposerinput appicon.icon -macassetdir darwin` also produces `Assets.car` from a `.icon` file (skipped on other platforms).
    dir: build
    sources:
      - "../assets/smeggtuner-app-icon.svg"
      - "appicon.icon"
    generates:
      - "appicon.png"
      - "darwin/icons.icns"
      - "windows/icon.ico"
    cmds:
      - rsvg-convert -w 1024 -h 1024 ../assets/smeggtuner-app-icon.svg -o appicon.png
      - go tool wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename windows/icon.ico -iconcomposerinput appicon.icon -macassetdir darwin

  update:build-assets:
    summary: Updates the build assets
    dir: build
    cmds:
      - go tool wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .
