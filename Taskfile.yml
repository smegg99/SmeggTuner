version: '3'

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  android:
    taskfile: ./build/android/Taskfile.yml
    optional: true

vars:
  APP_NAME: "smeggtuner"
  BIN_DIR: "bin"
  # GTK 3 (WebKitGTK 4.1) is the default: the GTK 4 port reallocates the whole compositing surface on a window drag.
  TAGS: '{{.WAILS_BUILD_TAGS | default "gtk3"}}'

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"
        vars:
          EXTRA_TAGS: '{{.TAGS}}'

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{OS}}:package"
        vars:
          EXTRA_TAGS: '{{.TAGS}}'

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"
