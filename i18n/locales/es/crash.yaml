# S99AB startup and crash dialogs (es).
close: {value: "Cerrar"}
copied: {value: "Copiado"}
copy: {value: "Copiar informe"}
details: {value: "Detalles"}
email: {value: "Preparar un correo con el informe"}
failed:
  value: "No se pudo completar la operación: {error}"
  placeholders:
    error: {type: string}
file:
  value: "Archivo: {path}"
  placeholders:
    path: {type: string}
kill: {value: "Forzar el cierre y preparar el informe"}
logs: {value: "Mostrar el archivo de registro en su carpeta"}
messageConfig:
  value: "No se pudo leer el archivo de configuración. Corrígelo o elimínalo y vuelve a iniciar {app}."
  placeholders:
    app: {type: string}
messageCrash:
  value: "{app} se cerró de forma inesperada. Puedes compartir el informe con el soporte técnico y reiniciar la aplicación."
  placeholders:
    app: {type: string}
messageHang: {value: "Es posible que la operación aún termine. Puedes esperar o cerrar la aplicación para ver el informe de diagnóstico."}
messageHangStopped:
  value: "Se cerró {app} después de que dejara de responder. Puedes compartir el informe con el soporte técnico o reiniciar la aplicación."
  placeholders:
    app: {type: string}
messageKilled:
  value: "{app} se cerró antes de poder indicar la causa del problema. Puedes compartir los detalles disponibles con el soporte técnico o reiniciar la aplicación."
  placeholders:
    app: {type: string}
messageOom:
  value: "El sistema se quedó sin memoria y cerró {app}. Puedes compartir el informe con el soporte técnico o reiniciar la aplicación."
  placeholders:
    app: {type: string}
messageStartup:
  value: "Corrige el problema indicado a continuación y vuelve a iniciar {app}."
  placeholders:
    app: {type: string}
restart: {value: "Reiniciar"}
save: {value: "Guardar informe"}
saved:
  value: "Guardado en {path}"
  placeholders:
    path: {type: string}
starting:
  value: "Iniciando {app}"
  placeholders:
    app: {type: string}
titleCrash: {value: "La aplicación se detuvo de forma inesperada"}
titleHang: {value: "La aplicación no responde"}
titleHangStopped: {value: "La aplicación dejó de responder"}
titleKilled: {value: "La aplicación se cerró de forma inesperada"}
titleStart: {value: "No se pudo iniciar la aplicación"}
wait: {value: "Esperar"}
windowCrash: {value: "fallo de la aplicación"}
windowHang: {value: "no responde"}
windowHangStopped: {value: "dejó de responder"}
windowKilled: {value: "cierre inesperado"}
windowStart: {value: "error de inicio"}
