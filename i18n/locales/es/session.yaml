# Target curve editor
curve.clearAll: {value: "Borrar curva"}

curve.clearAllConfirm:
  value: "Se eliminarán todos los puntos de anclaje. El objetivo volverá a la altura de la escala en cada nota y el afinador funcionará como un simple indicador."
curve.clearAllHint: {value: "Quita todos los puntos de anclaje y deja el objetivo en la altura de la escala."}
curve.clearAllTitle: {value: "¿Borrar toda la curva?"}
curve.entryUnit: {value: "Unidad de entrada"}

curve.help.hz:
  value: "En Hz, el objetivo se calcula con la4 = 440 Hz, como en la lista de batidos de referencia, por lo que no varía con el la4 de la sesión. «Mediciones grabadas» superpone las mediciones de la sesión a la lista. El menú «Lista» permite ajustar los puntos de anclaje a estas mediciones o copiar la lista de otra sesión."
curve.help.hzTitle: {value: "Hercios y mediciones"}

curve.help.interp:
  value: "Con la interpolación activada, las notas entre los puntos de anclaje siguen la línea. Si se desactiva, el valor de cada punto se mantiene hasta el siguiente. Sin puntos, el objetivo es la altura de la escala en todas las notas."
curve.help.interpTitle: {value: "Entre los puntos"}

curve.help.lead:
  value: "Para cada nota, el objetivo indica cuánto debe desviarse cada lengüeta de la altura de la escala. La tabla compara la lengüeta grabada con ese objetivo, en lugar de con el cero, para determinar si está dentro de la tolerancia."
curve.help.set:
  value: "Elige una nota y un valor y pulsa «Fijar», o arrastra un punto del gráfico hacia arriba o hacia abajo. Cada hilera tiene su propia línea y se resalta la que estás editando."
curve.help.setTitle: {value: "Fijar un punto"}
curve.helpTitle: {value: "Batidos deseados"}
curve.interpolate: {value: "Interpolar"}
curve.interpolateHint: {value: "Sigue la línea entre los puntos. Si se desactiva, el valor de cada punto se mantiene hasta el siguiente."}
