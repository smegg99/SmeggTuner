# S99AB startup and crash dialogs (da).
close: {value: "Luk"}
copied: {value: "Kopieret"}
copy: {value: "Kopiér rapport"}
details: {value: "Detaljer"}
email: {value: "Opret e-mail med rapporten"}
failed:
  value: "Handlingen mislykkedes: {error}"
