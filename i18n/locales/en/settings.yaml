# Sound-card calibration
calibration.askBody:
  value: >-
    An uncalibrated sample clock can cause a small fixed measurement error. Calibration takes
    about a minute and needs no sound.

calibration.askCalibrate: {value: "Calibrate now"}
calibration.askContinue: {value: "Continue uncorrected"}
calibration.askTitle: {value: "This sound card is not calibrated"}
calibration.hint: {value: "Fixes the sound card clock error. About a minute, no sound needed."}
calibration.label: {value: "Sound card calibration"}
calibration.open: {value: "Open"}
calibration.openHint: {value: "Show the calibration screen without measuring"}
calibration.saveFailed: {value: "Could not save calibration. The tuner is using the previously saved state."}
calibration.screen.again: {value: "Calibrate again"}
calibration.screen.bar.confirming: {value: "Confirming"}
calibration.screen.bar.settling: {value: "Settling"}

calibration.screen.calibrated:
  value: "Calibrated. Readings are corrected by {percent} %."
  placeholders:
    percent: {type: string}

calibration.screen.calibrating: {value: "Measuring the sound card clock"}

calibration.screen.how:
  value: "Readings may carry a small fixed pitch error. No sound needed, about a minute."

calibration.screen.lead: {value: "Not calibrated yet"}

calibration.screen.phase.confirming:
  value: "The reading holds still. Checking that it stays that way for 20 s."

calibration.screen.phase.preparing: {value: "Letting the input settle before its clock is measured."}
calibration.screen.phase.settling: {value: "Waiting for the clock reading to hold still."}

calibration.screen.pitch:
  value: "That is {pitch} at every note."
  placeholders:
    pitch: {type: string}

calibration.screen.preparing: {value: "Warming up the input"}
calibration.screen.retry: {value: "Readings stay uncorrected. Close other audio apps and try again."}
calibration.screen.return: {value: "Return"}
calibration.screen.stat.dropouts: {value: "Dropouts"}
calibration.screen.stat.elapsed: {value: "Elapsed"}
calibration.screen.stat.offset: {value: "Clock offset"}
calibration.screen.stat.rate: {value: "Sample rate"}
calibration.screen.stat.steadiness: {value: "Steadiness"}

calibration.screen.steadiness:
  value: "{ppm} ppm, target {target} ppm"
  placeholders:
    ppm: {type: string}
    target: {type: string}

calibration.screen.steps.done: {value: "Done"}
calibration.screen.steps.measure: {value: "Measure"}
calibration.screen.steps.prepare: {value: "Warm up"}
calibration.screen.traceEmpty: {value: "The clock offset is drawn here while it is measured."}
calibration.screen.unreliable: {value: "The clock never settled"}
calibration.start: {value: "Calibrate"}
calibration.startHint: {value: "Measure the input sample clock"}

calibration.status.calibrated:
  value: "Calibrated, {percent} %"
  placeholders:
    percent: {type: string}

calibration.status.calibrating:
  value: "Calibrating, {seconds} s ({percent} %), {progress} % done"
  placeholders:
    percent: {type: string}
    progress: {type: string}
    seconds: {type: string}

calibration.status.preparing: {value: "Preparing"}
calibration.status.uncalibrated: {value: "Not calibrated"}
calibration.status.unreliable: {value: "Unreliable, readings are not corrected"}

