# Recording controls and readings (English).
# Translate value and plural.forms only. Keep keys and {placeholders} unchanged.
# Editing guide: ../../README.md.
# Plurals: one = 1; other = 0, 2, 3, ...

# Recording controls
arm.hint: {value: "Record a take on every lock (Enter takes one now)"}
arm.needsSession: {value: "Open a session to record"}
arm.warmup: {value: "Not recording: play freely, nothing is saved. Press to start recording."}
undo.hint: {value: "Undo the last take"}

# Readings table and compact columns
mobile.current: {value: "Measured"}
mobile.error: {value: "Deviation"}

table.beat:
  value: "Beating {pair}"
  placeholders:
    pair: {type: string}

table.delete: {value: "Remove this reading"}
table.deleteHint: {value: "Permanently remove this reading. Play and record the note again to replace it."}
table.deleteTitle: {value: "Remove this reading?"}
table.editHint: {value: "Click or press Enter to edit the value"}
table.empty: {value: "Start recording, then play notes to save readings."}
table.graph: {value: "Graph"}

table.graphHint:
  value: >-
    Compare each reed with its target. Click a column to select its row; click again to select the
    next register.

table.graphLabel: {value: "Each recorded note's reed errors"}
table.helpTitle: {value: "About this table"}
table.label: {value: "Recorded tuning"}
table.latest: {value: "Recorded last: Backspace removes it"}
table.manual: {value: "Edited"}
table.manualHint: {value: "A value in this row was typed, not heard."}

table.notes:
  plural:
    argument: count
    forms:
      one: "one note"
      other: "{count} notes"
  placeholders:
    count: {type: integer}

table.unitHint:
  value: >-
    Reed deviations use the unit selected in Settings. Beats use hertz or the deviation unit, as
    selected in the toolbar.

# Report export dialog
report.csv: {value: "CSV"}
report.date: {value: "Date"}
report.format: {value: "Format"}

report.formatHint:
  value: >-
    PDF is the card as one A4 page, laid out the way it prints. HTML is the same sheet as a web
    page. CSV is the table for a spreadsheet.

report.html: {value: "HTML"}
report.notes: {value: "Note on the card"}
report.notesHint: {value: "Printed under the table. What was done, or what still needs doing."}

report.pass:
  value: "Pass: {label}"
  placeholders:
    label: {type: string}

report.pdf: {value: "PDF"}
report.title: {value: "Tuning card"}

# Recording errors
error.takeNotFound: {value: "That take is no longer in the pass."}
error.unexpected: {value: "The operation failed. See the log for details."}
