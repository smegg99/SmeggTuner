clearAll:
  value: Clear curve
  description: 'target curve editor: clearAll.'
clearAllConfirm:
  value: Every anchor is taken out. The goal goes back to the scale pitch for every note, and the tuner becomes
    a plain indicator.
  description: 'target curve editor: clearAllConfirm.'
clearAllHint:
  value: Take every anchor out and leave the goal at the scale pitch.
  description: 'target curve editor: clearAllHint.'
clearAllTitle:
  value: Clear the whole curve?
  description: 'target curve editor: clearAllTitle.'
entryUnit:
  value: Entry unit
  description: 'target curve editor: entryUnit.'
help.hz:
  value: Hz enters a goal in hertz, read at A4 = 440 Hz as the reference beat list does, so it does not move with
    the session's A4. Recorded lays this session's readings over the list, and List can fit the anchors to them
    or copy another session's list.
  description: 'target curve editor: help.hz.'
help.hzTitle:
  value: Hz and readings
  description: 'target curve editor: help.hzTitle.'
help.interp:
  value: With Interpolate on, notes between your anchors follow the line; off, each anchor holds until the next.
    With no anchors the goal is the scale pitch everywhere.
  description: 'target curve editor: help.interp.'
help.interpTitle:
  value: Between the points
  description: 'target curve editor: help.interpTitle.'
help.lead:
  value: 'The goal you are tuning toward: how far each reed should sit from its scale pitch, note by note. A recorded
    reed is read against this, so the table calls it in or out against your target, not against dead-centre.'
  description: 'target curve editor: help.lead.'
help.set:
  value: Pick a note and a value and press Set, or drag a point on the chart up or down. Each rank is its own line,
    and the one you are editing is highlighted.
  description: 'target curve editor: help.set.'
help.setTitle:
  value: Setting a point
  description: 'target curve editor: help.setTitle.'
helpTitle:
  value: Desired beatings
  description: 'target curve editor: helpTitle.'
interpolate:
  value: Interpolate
  description: 'target curve editor: interpolate.'
interpolateHint:
  value: Follow the line between anchors. Off, each anchor holds until the next one.
  description: 'target curve editor: interpolateHint.'
menu.ends:
  value: Beyond the anchors
  description: 'target curve editor: menu.ends.'
menu.extendHigh:
  value: Continue above the highest
  description: 'target curve editor: menu.extendHigh.'
menu.extendLow:
  value: Continue below the lowest
  description: 'target curve editor: menu.extendLow.'
menu.fit:
  value: Fit to this session's readings
  description: 'target curve editor: menu.fit.'
menu.fitBody:
  plural:
    argument: n
    forms:
      one: The anchors are replaced by a curve fitted to the one reading.
      other: The anchors are replaced by a curve fitted to {n} readings.
  description: 'target curve editor: menu.fitBody. Parameters: n.'
  placeholders:
    n:
      type: integer
menu.fromFile:
  value: Copy from a session file
  description: 'target curve editor: menu.fromFile.'
menu.fromSession:
  value: Copy from a session
  description: 'target curve editor: menu.fromSession.'
menu.label:
  value: List
  description: 'target curve editor: menu.label.'
menu.replace:
  value: Replace the list
  description: 'target curve editor: menu.replace.'
menu.replaceBody:
  value: The anchors are replaced by the other list, with its settings.
  description: 'target curve editor: menu.replaceBody.'
menu.replaceConfirm:
  value: Replace
  description: 'target curve editor: menu.replaceConfirm.'
menu.replaceTitle:
  value: Replace the beat list?
  description: 'target curve editor: menu.replaceTitle.'
rank:
  value: Rank
  description: 'target curve editor: rank.'
recorded:
  value: Recorded
  description: 'target curve editor: recorded.'
recordedHint:
  value: Show this session's readings on the graph
  description: 'target curve editor: recordedHint.'
remove:
  value: Remove
  description: 'target curve editor: remove.'
removeHint:
  value: Take this note’s anchor out of the curve.
  description: 'target curve editor: removeHint.'
scale:
  value: Scale {v}
  description: 'target curve editor: scale. Parameters: v.'
  placeholders:
    v:
      type: string
scaleAuto:
  value: Scale auto
  description: 'target curve editor: scaleAuto.'
scaleHint:
  value: How far up and down the graph reaches
  description: 'target curve editor: scaleHint.'
set:
  value: Set
  description: 'target curve editor: set.'
setHint:
  value: Put an anchor on this note for the rank selected.
  description: 'target curve editor: setHint.'
startHint:
  value: No anchors yet. The goal is the scale pitch for every note.
  description: 'target curve editor: startHint.'
