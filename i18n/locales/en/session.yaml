# Target curve editor
curve.clearAll: {value: "Clear curve"}

curve.clearAllConfirm:
  value: >-
    Every anchor is taken out. The goal goes back to the scale pitch for every note, and the tuner
    becomes a plain indicator.

curve.clearAllHint: {value: "Take every anchor out and leave the goal at the scale pitch."}
curve.clearAllTitle: {value: "Clear the whole curve?"}
curve.entryUnit: {value: "Entry unit"}

curve.help.hz:
  value: >-
    Hz enters a goal in hertz, read at A4 = 440 Hz as the reference beat list does, so it does not
    move with the session's A4. Recorded lays this session's readings over the list, and List can
    fit the anchors to them or copy another session's list.

curve.help.hzTitle: {value: "Hz and readings"}

curve.help.interp:
  value: >-
    With Interpolate on, notes between your anchors follow the line; off, each anchor holds until
    the next. With no anchors the goal is the scale pitch everywhere.

curve.help.interpTitle: {value: "Between the points"}

curve.help.lead:
  value: >-
    The goal you are tuning toward: how far each reed should sit from its scale pitch, note by
    note. A recorded reed is read against this, so the table calls it in or out against your
    target, not against dead-centre.

curve.help.set:
  value: >-
    Pick a note and a value and press Set, or drag a point on the chart up or down. Each rank is
    its own line, and the one you are editing is highlighted.

curve.help.setTitle: {value: "Setting a point"}
curve.helpTitle: {value: "Desired beatings"}
curve.interpolate: {value: "Interpolate"}
curve.interpolateHint: {value: "Follow the line between anchors. Off, each anchor holds until the next one."}
curve.menu.ends: {value: "Beyond the anchors"}
curve.menu.extendHigh: {value: "Continue above the highest"}
curve.menu.extendLow: {value: "Continue below the lowest"}
curve.menu.fit: {value: "Fit to this session's readings"}

curve.menu.fitBody:
