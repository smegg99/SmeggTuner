  value: >-
    This change would alter the reed ranks used by existing readings. The change was not saved.
    Restore the previous ranks or create a new session.

accordion.frozen:
  value: >-
    Once readings are saved, their reference pitch, transposition and reed ranks are fixed.
    You can still add registers using the existing ranks.
