# Printed reports and export (English).
# Translate value and plural.forms only. Keep keys and {placeholders} unchanged.
# Editing guide: ../../README.md.
# Plurals: one = 1; other = 0, 2, 3, ...

# Report title and instrument details
facts.curve: {value: "Goal curve"}
facts.curveNone: {value: "none"}
facts.curveUnnamed: {value: "unnamed"}
facts.reference: {value: "Reference A4 (this pass)"}
facts.tolerance: {value: "Tolerance"}

facts.toleranceValue:
  value: "{reed} {unit} reed / {beat} {unit} beat"
  placeholders:
    beat: {type: string}
    reed: {type: string}
    unit: {type: string}

facts.transpose: {value: "Transposition"}

facts.transposeValue:
  value: "{key} sounds as {sounds}"
  placeholders:
    key: {type: string}
    sounds: {type: string}

title: {value: "Tuning report"}

# Table and column headings
head.beat:
  value: "Beat {pair}"
  placeholders:
    pair: {type: string}

table.bassTitle:
  value: "Bass tuning table ({unit})"
  placeholders:
    unit: {type: string}

table.curr: {value: "Curr"}
table.err: {value: "Err"}
table.register: {value: "Register"}

table.title:
  value: "Tuning table ({unit})"
  placeholders:
    unit: {type: string}

# Deviation units
unit.cents.name: {value: "cents"}
unit.cents.symbol: {value: "c"}
unit.reference.name: {value: "units of 0.06 %"}

# Graph legend and reading markers
graph.edited:
  value: "{mark} - hand-edited."
  placeholders:
    mark: {type: string}

legend.error.cents:
  value: "File toward zero. Cents from the tempered scale at {a4} Hz."
  placeholders:
    a4: {type: string}

legend.error.key: {value: "Error = Curr - Goal."}
legend.error.noCurve: {value: "No goal curve: Goal is zero, Error is deviation from the scale."}

legend.error.reference:
  value: "File toward zero. Units of 0.06 % of the note frequency, from the tempered scale at {a4} Hz."
  placeholders:
    a4: {type: string}

legend.out.short: {value: "outside tolerance"}
legend.takes.key: {value: "xN"}
legend.takes.short: {value: "recorded more than once, last take shown"}
mark.edited: {value: "H"}
mark.out: {value: "!"}

# Summary and footer
footer.generated:
  value: "Generated {at} by {app}"
  placeholders:
    app: {type: string}
    at: {type: string}

summary.allIn: {value: "All in tolerance."}

summary.beats:
  plural:
    argument: pluralCount
    forms:
      one: "{pluralCount} beat"
      other: "{pluralCount} beats"
  placeholders:
    pluralCount: {type: integer}

summary.line:
  value: "{notes} ({min} to {max}), {reeds}, {beats}."
  placeholders:
    beats: {type: string}
    max: {type: string}
    min: {type: string}
    notes: {type: string}
    reeds: {type: string}

summary.notes:
  plural:
    argument: pluralCount
    forms:
      one: "{pluralCount} note"
      other: "{pluralCount} notes"
  placeholders:
    pluralCount: {type: integer}

summary.out:
  plural:
    argument: pluralCount
    forms:
      one: "{pluralCount} out of tolerance ({reeds}, {beats})."
      other: "{pluralCount} out of tolerance ({reeds}, {beats})."
  placeholders:
    beats: {type: string}
    pluralCount: {type: integer}
    reeds: {type: string}

summary.reeds:
  plural:
    argument: pluralCount
    forms:
      one: "{pluralCount} reed reading"
      other: "{pluralCount} reed readings"
  placeholders:
    pluralCount: {type: integer}

summary.reedsShort:
  plural:
    argument: pluralCount
    forms:
      one: "{pluralCount} reed"
      other: "{pluralCount} reeds"
  placeholders:
    pluralCount: {type: integer}

# Export errors
error.invalidDate: {value: "Enter a valid date in YYYY-MM-DD format."}
error.invalidFormat: {value: "That is not a format this report can be written in."}

error.noBrowser:
  value: >-
    A PDF is laid out by a browser, and there is no Chrome or Chromium on this machine to do it
    with. Install one, or export the card as HTML and print that.

error.openFailed: {value: "The report was written, but no browser would open it. Open the file yourself."}
error.renderFailed: {value: "The report could not be built. Nothing was written."}

error.writeFailed:
  value: "The report could not be written there. The old file, if there was one, is untouched."
