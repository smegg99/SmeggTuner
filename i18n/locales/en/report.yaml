error.invalidDate:
  value: Enter a valid date in YYYY-MM-DD format.
  description: 'tuning report and export: error.invalidDate.'
error.invalidFormat:
  value: That is not a format this report can be written in.
  description: 'tuning report and export: error.invalidFormat.'
error.noBrowser:
  value: A PDF is laid out by a browser, and there is no Chrome or Chromium on this machine to do it with. Install
    one, or export the card as HTML and print that.
  description: 'tuning report and export: error.noBrowser.'
error.openFailed:
  value: The report was written, but no browser would open it. Open the file yourself.
  description: 'tuning report and export: error.openFailed.'
error.renderFailed:
  value: The report could not be built. Nothing was written.
  description: 'tuning report and export: error.renderFailed.'
error.writeFailed:
  value: The report could not be written there. The old file, if there was one, is untouched.
  description: 'tuning report and export: error.writeFailed.'
