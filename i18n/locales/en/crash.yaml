# S99AB startup and crash dialogs (en).
close: {value: "Close"}
copied: {value: "Copied"}
copy: {value: "Copy report"}
details: {value: "Details"}
email: {value: "Compose report email"}
failed:
  value: "That did not work: {error}"
  placeholders:
    error: {type: string}
file:
  value: "File: {path}"
  placeholders:
    path: {type: string}
kill: {value: "Close app and view report"}
logs: {value: "Show log in file manager"}
messageConfig:
  value: "The settings file could not be read. Fix it or delete it, then start {app} again."
  placeholders:
    app: {type: string}
messageCrash:
  value: "{app} stopped unexpectedly. You can share the report with support, then restart the app."
  placeholders:
    app: {type: string}
messageHang: {value: "The app may still finish. Wait, or close it to view the diagnostic report."}
messageHangStopped:
  value: "{app} was closed after it stopped responding. You can share the report with support or restart the app."
  placeholders:
    app: {type: string}
messageKilled:
  value: "{app} closed before it could report the cause. You can share the available details with support or restart the app."
  placeholders:
    app: {type: string}
messageOom:
  value: "The system ran out of memory and closed {app}. You can share the report with support or restart the app."
  placeholders:
    app: {type: string}
messageStartup:
  value: "Fix the cause below, then start {app} again."
  placeholders:
    app: {type: string}
restart: {value: "Restart"}
save: {value: "Save report"}
saved:
  value: "Saved to {path}"
  placeholders:
    path: {type: string}
starting:
  value: "Starting {app}"
  placeholders:
    app: {type: string}
titleCrash: {value: "The app stopped unexpectedly"}
titleHang: {value: "The app is not responding"}
titleHangStopped: {value: "The app stopped responding"}
titleKilled: {value: "The app closed unexpectedly"}
titleStart: {value: "The app could not start"}
wait: {value: "Wait"}
windowCrash: {value: "crashed"}
windowHang: {value: "not responding"}
windowHangStopped: {value: "stopped responding"}
windowKilled: {value: "closed unexpectedly"}
windowStart: {value: "could not start"}
