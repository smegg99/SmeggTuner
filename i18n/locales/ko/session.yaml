# Target curve editor
curve.clearAll: {value: "곡선 지우기"}

curve.clearAllConfirm:
  value: "모든 기준점을 제거합니다. 각 음의 목표가 음계 음높이로 돌아가며 튜너는 편차만 표시합니다."
curve.clearAllHint: {value: "모든 기준점을 제거하고 목표를 음계 음높이로 되돌립니다."}
curve.clearAllTitle: {value: "곡선 전체를 지울까요?"}
curve.entryUnit: {value: "입력 단위"}

curve.help.hz:
  value: "Hz를 선택하면 기준 맥놀이 목록과 같이 A4 = 440 Hz 기준으로 음계 음높이에서 벗어날 목표 편차를 Hz로 입력하므로 세션의 A4가 달라져도 값은 변하지 않습니다. ‘기록됨’으로 세션 측정값을 겹쳐 보고 ‘목록’에서 기준점을 값에 맞추거나 다른 세션의 목록을 복사할 수 있습니다."
curve.help.hzTitle: {value: "헤르츠와 측정값"}

curve.help.interp:
  value: "보간을 켜면 기준점 사이의 음이 선을 따릅니다. 끄면 다음 점까지 이전 점의 값을 유지합니다. 점이 없으면 모든 음에서 음계 음높이가 목표입니다."
curve.help.interpTitle: {value: "기준점 사이"}

curve.help.lead:
  value: "각 음에서 각 리드가 음계 음높이와 얼마나 달라야 하는지를 나타내는 조율 목표입니다. 표는 편차 0이 아니라 이 목표와 기록한 리드를 비교해 조율 여부를 판정합니다."
curve.help.set:
  value: "음과 값을 선택하고 ‘설정’을 누르거나 그래프의 점을 위아래로 드래그하세요. 각 리드 열에는 별도의 선이 있고 편집 중인 선은 강조 표시됩니다."
