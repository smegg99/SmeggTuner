# Recording controls
arm.hint: {value: "안정된 측정값을 자동 기록 중입니다. 누르면 기록이 멈추고 Enter를 누르면 현재 값을 바로 기록합니다."}
arm.needsSession: {value: "측정값을 기록하려면 세션을 여세요"}
