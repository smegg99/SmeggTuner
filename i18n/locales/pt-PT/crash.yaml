# S99AB startup and crash dialogs (pt-PT).
close: {value: "Fechar"}
copied: {value: "Copiado"}
copy: {value: "Copiar relatório"}
details: {value: "Detalhes"}
email: {value: "Preparar e-mail com o relatório"}
failed:
  value: "A operação falhou: {error}"
  placeholders:
    error: {type: string}
file:
  value: "Ficheiro: {path}"
  placeholders:
    path: {type: string}
kill: {value: "Forçar o fecho e preparar o relatório"}
