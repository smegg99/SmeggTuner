table.notes:
  plural:
    argument: count
    forms:
      one: "uma nota"
      other: "{count} notas"
  placeholders:
    count: {type: integer}

table.unitHint:
  value: "Os desvios das palhetas usam a unidade escolhida nas Definições. Os batimentos são apresentados em hertz ou na unidade de desvio, conforme a seleção na barra de ferramentas."
