# Recording controls and readings (pt-PT).
# Translate value and plural.forms only. Keep keys and {placeholders} unchanged.
# Editing guide: ../../README.md.
# Plurals: one, other (locale cardinal rules).

# Recording controls
arm.hint: {value: "As leituras estáveis são registadas. Prima para parar o registo ou use Enter para guardar já a medição atual."}
