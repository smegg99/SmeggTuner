# Target curve editor
curve.clearAll: {value: "曲線をクリア"}

curve.clearAllConfirm:
  value: "すべての制御点を削除します。各音の目標は音階の音高に戻り、チューナーは偏差を示すだけになります。"
curve.clearAllHint: {value: "すべての制御点を外し、音階の音高を目標に戻します。"}
curve.clearAllTitle: {value: "曲線全体をクリアしますか？"}
