curve.help.hz:
  value: "Hz では基準のうなり表と同じく A4 = 440 Hz 換算で目標を入力するため、セッションの A4 を変えても値は動きません。「記録済み」で今回の測定値を重ね、「リスト」で測定値に制御点を合わせたり、別のセッションのリストをコピーしたりできます。"
curve.help.hzTitle: {value: "ヘルツと測定値"}

curve.help.interp:
  value: "補間を有効にすると制御点間の音は線に沿います。無効にすると次の点まで同じ値を保ちます。点がなければ全音の目標は音階の音高です。"
curve.help.interpTitle: {value: "制御点の間"}

curve.help.lead:
  value: "各音でリードを音階の音高からどれだけずらすかを示す調律目標です。表の合否は、偏差ゼロではなく、この目標と記録したリードを比較して決まります。"
curve.help.set:
  value: "音と値を選んで「設定」を押すか、グラフの点を上下にドラッグします。リード列ごとに線があり、編集中の線が強調表示されます。"
