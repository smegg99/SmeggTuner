# Printed reports and export (Polish).
# Translate value and plural.forms only. Keep keys and {placeholders} unchanged.
# Editing guide: ../../README.md.
# Plurals: one = 1; few = 2, 3, 4, 22; many = 0, 5, 12, 21; other = fractions.

# Report title and instrument details
facts.curve: {value: "Krzywa docelowa"}
facts.curveNone: {value: "brak"}
facts.curveUnnamed: {value: "bez nazwy"}
facts.reference: {value: "Odniesienie A4 (ten przebieg)"}
facts.tolerance: {value: "Tolerancja"}

facts.toleranceValue:
  value: "{reed} {unit} na głosie / {beat} {unit} na dudnieniu"
  placeholders:
    beat: {type: string}
    reed: {type: string}
    unit: {type: string}

facts.transpose: {value: "Transpozycja"}

facts.transposeValue:
  value: "{key} brzmi jako {sounds}"
  placeholders:
    key: {type: string}
    sounds: {type: string}

title: {value: "Raport strojenia"}

# Table and column headings
head.beat:
  value: "Dud. {pair}"
  placeholders:
    pair: {type: string}

table.bassTitle:
  value: "Tabela strojenia basów ({unit})"
  placeholders:
    unit: {type: string}

table.curr: {value: "Jest"}
table.err: {value: "Popr."}
table.register: {value: "Rejestr"}

table.title:
  value: "Tabela strojenia ({unit})"
  placeholders:
    unit: {type: string}

# Deviation units
unit.cents.name: {value: "centy"}
unit.cents.symbol: {value: "c"}
unit.reference.name: {value: "jednostki 0,06 %"}

# Graph legend and reading markers
graph.edited:
  value: "{mark} - edytowane ręcznie."
  placeholders:
    mark: {type: string}

legend.error.cents:
  value: "Piłuj w stronę zera. Centy od skali równomiernie temperowanej przy {a4} Hz."
  placeholders:
    a4: {type: string}

legend.error.key: {value: "Poprawka = Jest - Cel."}
legend.error.noCurve: {value: "Brak krzywej docelowej: Cel to zero, Poprawka to odchyłka od skali."}

legend.error.reference:
  value: >-
    Piłuj w stronę zera. Jednostki 0,06 % częstotliwości dźwięku, od skali równomiernie
    temperowanej przy {a4} Hz.
  placeholders:
    a4: {type: string}

legend.out.short: {value: "poza tolerancją"}
legend.takes.key: {value: "xN"}
legend.takes.short: {value: "nagrane wielokrotnie, pokazano ostatnie"}
mark.edited: {value: "R"}
mark.out: {value: "!"}

# Summary and footer
footer.generated:
  value: "Wygenerowano {at} przez {app}"
  placeholders:
    app: {type: string}
    at: {type: string}

summary.allIn: {value: "Wszystko w tolerancji."}

summary.beats:
  plural:
    argument: pluralCount
    forms:
      one: "{pluralCount} dudnienie"
      few: "{pluralCount} dudnienia"
      many: "{pluralCount} dudnień"
      other: "{pluralCount} dudnienia"
  placeholders:
    pluralCount: {type: integer}

summary.line:
  value: "{notes} (od {min} do {max}), {reeds}, {beats}."
  placeholders:
    beats: {type: string}
    max: {type: string}
    min: {type: string}
    notes: {type: string}
    reeds: {type: string}

summary.notes:
  plural:
    argument: pluralCount
    forms:
      one: "{pluralCount} dźwięk"
      few: "{pluralCount} dźwięki"
      many: "{pluralCount} dźwięków"
      other: "{pluralCount} dźwięku"
  placeholders:
    pluralCount: {type: integer}

summary.out:
  plural:
    argument: pluralCount
    forms:
      one: "{pluralCount} poza tolerancją ({reeds}, {beats})."
      few: "{pluralCount} poza tolerancją ({reeds}, {beats})."
      many: "{pluralCount} poza tolerancją ({reeds}, {beats})."
      other: "{pluralCount} poza tolerancją ({reeds}, {beats})."
  placeholders:
    beats: {type: string}
    pluralCount: {type: integer}
    reeds: {type: string}

summary.reeds:
  plural:
    argument: pluralCount
    forms:
      one: "{pluralCount} odczyt głosu"
      few: "{pluralCount} odczyty głosów"
      many: "{pluralCount} odczytów głosów"
      other: "{pluralCount} odczytu głosów"
  placeholders:
    pluralCount: {type: integer}

summary.reedsShort:
  plural:
    argument: pluralCount
    forms:
      one: "{pluralCount} głos"
      few: "{pluralCount} głosy"
      many: "{pluralCount} głosów"
      other: "{pluralCount} głosu"
  placeholders:
    pluralCount: {type: integer}

# Export errors
error.invalidDate: {value: "Wpisz prawidłową datę w formacie RRRR-MM-DD."}
error.invalidFormat: {value: "W tym formacie raportu nie da się zapisać."}

error.noBrowser:
  value: >-
    PDF składa przeglądarka, a na tym komputerze nie ma Chrome ani Chromium. Zainstaluj jedną z
    nich albo wyeksportuj kartę jako HTML i wydrukuj ją.

error.openFailed:
  value: "Raport został zapisany, ale żadna przeglądarka go nie otworzyła. Otwórz plik samodzielnie."

error.renderFailed: {value: "Nie udało się zbudować raportu. Nic nie zostało zapisane."}

error.writeFailed:
  value: "Nie udało się zapisać raportu w tym miejscu. Poprzedni plik, jeśli był, pozostał nietknięty."
