# Target curve editor
curve.clearAll: {value: "Wyczyść krzywą"}

curve.clearAllConfirm:
  value: >-
    Wszystkie punkty krzywej zostaną usunięte. Docelowa odchyłka każdego stroika od skali
    wróci do zera.
curve.clearAllHint: {value: "Usuń wszystkie punkty i przywróć zerową odchyłkę docelową dla każdego dźwięku."}
curve.clearAllTitle: {value: "Wyczyścić całą krzywą?"}
curve.entryUnit: {value: "Jednostka wprowadzanej wartości"}

curve.help.hz:
  value: >-
    W trybie Hz wpisz odchyłkę częstotliwości obliczoną przy A4 = 440 Hz. Wartość w tym polu
    nie zależy od A4 sesji. Włącz „Pokaż odczyty”, aby nanieść pomiary na wykres. W menu
    „Lista” możesz dopasować do nich krzywą lub skopiować listę z innej sesji.
curve.help.hzTitle: {value: "Hz i odczyty"}

curve.help.interp:
  value: >-
    Przy włączonej interpolacji wartości między punktami zmieniają się liniowo. Przy
    wyłączonej wartość z danego punktu obowiązuje aż do następnego. Gdy nie ma punktów,
    docelowa odchyłka każdego dźwięku wynosi zero.
curve.help.interpTitle: {value: "Między punktami"}

curve.help.lead:
  value: >-
    Dla każdego dźwięku określ, o ile wyżej lub niżej od wysokości wynikającej ze skali ma
    brzmieć dany stroik. Tabela porównuje zmierzoną odchyłkę z docelową i oznacza wyniki poza
    tolerancją.
curve.help.set:
  value: >-
    Wybierz dźwięk, wpisz wartość i naciśnij „Ustaw” lub przeciągnij punkt na wykresie w
    pionie. Każda linia odpowiada jednemu chórowi. Wyróżniona linia pokazuje aktualnie
    edytowany chór.
curve.help.setTitle: {value: "Ustawianie punktu"}
curve.helpTitle: {value: "Docelowe odchyłki stroików i dudnienia"}
curve.interpolate: {value: "Interpoluj"}

curve.interpolateHint:
  value: "Po włączeniu wartości zmieniają się liniowo między punktami. Po wyłączeniu wartość pozostaje stała aż do następnego punktu."

