# Target curve editor
curve.clearAll: {value: "Wyczyść krzywą"}

curve.clearAllConfirm:
  value: >-
    Wszystkie punkty zostaną usunięte. Cel wróci do wysokości skali dla każdego dźwięku, a tuner
    stanie się zwykłym wskaźnikiem.

curve.clearAllHint: {value: "Usuń wszystkie punkty i zostaw cel na wysokości skali."}
curve.clearAllTitle: {value: "Wyczyścić całą krzywą?"}
curve.entryUnit: {value: "Jednostka wpisu"}

curve.help.hz:
  value: >-
    Hz wpisuje cel w hercach, liczony przy A4 = 440 Hz jak w liście dudnień oryginału, więc nie
    zmienia się z A4 sesji. Nagrane kładzie odczyty tej sesji na listę, a Lista może dopasować do
    nich punkty albo skopiować listę z innej sesji.

curve.help.hzTitle: {value: "Hz i odczyty"}

curve.help.interp:
  value: >-
    Przy włączonej Interpolacji dźwięki między punktami idą po linii; wyłączona - każdy punkt
    obowiązuje aż do następnego. Bez punktów celem jest wszędzie wysokość skali.

curve.help.interpTitle: {value: "Między punktami"}

curve.help.lead:
  value: >-
    Cel, do którego stroisz: jak daleko każdy głos ma leżeć od swojej wysokości skali, dźwięk po
    dźwięku. Nagrany głos jest oceniany względem tego celu, a nie względem czystego środka.

curve.help.set:
  value: >-
    Wybierz dźwięk i wartość i naciśnij Ustaw, albo przeciągnij punkt na wykresie w górę lub w
    dół. Każdy chór to osobna linia, a edytowany jest wyróżniony.

curve.help.setTitle: {value: "Ustawianie punktu"}
curve.helpTitle: {value: "Żądane dudnienia"}
curve.interpolate: {value: "Interpoluj"}

curve.interpolateHint:
