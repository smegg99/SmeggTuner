# Recording controls and readings (Polish).
# Translate value and plural.forms only. Keep keys and {placeholders} unchanged.
# Editing guide: ../../README.md.
# Plurals: one = 1; few = 2, 3, 4, 22; many = 0, 5, 12, 21; other = fractions.

# Recording controls
arm.hint: {value: "Zapisuj odczyt przy każdej blokadzie (Enter zapisuje od razu)"}
arm.needsSession: {value: "Otwórz sesję, aby nagrywać"}

arm.warmup:
  value: "Nagrywanie wyłączone: graj swobodnie, nic nie jest zapisywane. Naciśnij, aby rozpocząć nagrywanie."

undo.hint: {value: "Cofnij ostatnie nagranie"}

# Readings table and compact columns
mobile.current: {value: "Pomiar"}
mobile.error: {value: "Odchyłka"}

table.beat:
  value: "Dudnienie {pair}"
  placeholders:
    pair: {type: string}

table.delete: {value: "Usuń ten odczyt"}
table.deleteHint: {value: "Trwale usuń ten odczyt. Zagraj i nagraj nutę ponownie, aby go zastąpić."}
table.deleteTitle: {value: "Usunąć ten odczyt?"}
table.editHint: {value: "Kliknij lub naciśnij Enter, aby zmienić wartość"}
table.empty: {value: "Włącz nagrywanie, a następnie graj dźwięki, aby zapisać odczyty."}
table.graph: {value: "Wykres"}

table.graphHint:
  value: >-
    Porównaj każdy stroik z jego celem. Kliknij kolumnę, aby wybrać jej wiersz; kliknij ponownie,
    aby wybrać następny rejestr.

table.graphLabel: {value: "Błędy głosów każdego nagranego dźwięku"}
table.helpTitle: {value: "O tej tabeli"}
table.label: {value: "Nagrane strojenie"}
table.latest: {value: "Nagrany ostatnio: Backspace go usuwa"}
table.manual: {value: "Edytowane"}
table.manualHint: {value: "Wartość w tym wierszu została wpisana ręcznie, a nie usłyszana."}

table.notes:
  plural:
    argument: count
    forms:
      one: "jeden dźwięk"
      few: "{count} dźwięki"
      many: "{count} dźwięków"
      other: "{count} dźwięków"
  placeholders:
    count: {type: integer}

table.unitHint:
  value: >-
    Odchyłki stroików są podawane w jednostce wybranej w Ustawieniach. Dudnienia są podawane w
    hercach lub jednostce odchyłki, zgodnie z wyborem na pasku narzędzi.

# Report export dialog
report.csv: {value: "CSV"}
report.date: {value: "Data"}
report.format: {value: "Format"}

report.formatHint:
