    PDF to karta na jednej stronie A4, złożona tak jak się drukuje. HTML to ten sam arkusz jako
    strona. CSV to tabela do arkusza kalkulacyjnego.

report.html: {value: "HTML"}
report.notes: {value: "Notatka na karcie"}
