# Recording controls and readings (Polish).
# Translate value and plural.forms only. Keep keys and {placeholders} unchanged.
# Editing guide: ../../README.md.
# Plurals: one = 1; few = 2, 3, 4, 22; many = 0, 5, 12, 21; other = fractions.

# Recording controls
arm.hint: {value: "Stabilne odczyty są zapisywane. Kliknij, aby wyłączyć zapis, lub naciśnij Enter, aby zapisać bieżący odczyt."}
arm.needsSession: {value: "Otwórz sesję, aby zapisywać odczyty"}

arm.warmup:
  value: "Możesz grać bez zapisywania odczytów. Kliknij, aby włączyć zapis."

undo.hint: {value: "Cofnij zapis ostatniego odczytu"}

# Readings table and compact columns
mobile.current: {value: "Pomiar"}
mobile.error: {value: "Błąd"}

table.beat:
  value: "Dudnienie {pair}"
  placeholders:
    pair: {type: string}

table.delete: {value: "Usuń ten odczyt"}
table.deleteHint: {value: "Odczyt zostanie trwale usunięty. Aby go zastąpić, zagraj ten dźwięk ponownie i zapisz nowy pomiar."}
table.deleteTitle: {value: "Usunąć ten odczyt?"}
table.editHint: {value: "Kliknij lub naciśnij Enter, aby zmienić wartość"}
table.empty: {value: "Włącz zapis odczytów i zagraj kolejne dźwięki."}
table.graph: {value: "Wykres"}

table.graphHint:
  value: >-
    Porównaj odchyłkę każdego stroika z wartością docelową. Kliknij kolumnę wykresu, aby
    wybrać odpowiedni wiersz tabeli. Kliknij ponownie, aby przejść do następnego rejestru.
table.graphLabel: {value: "Błędy strojenia poszczególnych stroików dla każdego zmierzonego dźwięku"}
table.helpTitle: {value: "O tej tabeli"}
table.label: {value: "Zapisane pomiary stroju"}
table.latest: {value: "Ostatnio zapisany odczyt (Backspace usuwa)"}
table.manual: {value: "Edytowane"}
table.manualHint: {value: "Jedną z wartości w tym wierszu wpisano ręcznie."}

table.notes:
  plural:
    argument: count
    forms:
      one: "jeden dźwięk"
      few: "{count} dźwięki"
      many: "{count} dźwięków"
      other: "{count} dźwięku"
  placeholders:
    count: {type: integer}

table.unitHint:
  value: >-
    Odchyłki stroików są podawane w jednostce wybranej w Ustawieniach. Dudnienia są podawane w
    hercach lub jednostce odchyłki, zgodnie z wyborem na pasku narzędzi.

