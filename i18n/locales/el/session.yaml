# Target curve editor
curve.clearAll: {value: "Εκκαθάριση καμπύλης"}

curve.clearAllConfirm:
  value: "Αφαιρούνται όλα τα σημεία αναφοράς. Ο στόχος κάθε νότας επιστρέφει στο ύψος της κλίμακας και το χορδιστήρι λειτουργεί ως απλή ένδειξη."
curve.clearAllHint: {value: "Αφαίρεση όλων των σημείων αναφοράς και επαναφορά του στόχου στο ύψος της κλίμακας."}
curve.clearAllTitle: {value: "Να εκκαθαριστεί όλη η καμπύλη;"}
curve.entryUnit: {value: "Μονάδα εισαγωγής"}

curve.help.hz:
  value: "Με Hz εισάγετε τον στόχο σε χερτζ με αναφορά A4 = 440 Hz, όπως στη λίστα διακροτημάτων αναφοράς. Έτσι δεν μετακινείται με το A4 της συνεδρίας. Η επιλογή «Καταγεγραμμένα» προβάλλει τις ενδείξεις πάνω στη λίστα. Από τη «Λίστα» μπορείτε να προσαρμόσετε τα σημεία αναφοράς στις ενδείξεις ή να αντιγράψετε τη λίστα άλλης συνεδρίας."
curve.help.hzTitle: {value: "Χερτζ και ενδείξεις"}

curve.help.interp:
  value: "Με ενεργή παρεμβολή, οι νότες ανάμεσα στα σημεία αναφοράς ακολουθούν τη γραμμή. Διαφορετικά η τιμή κάθε σημείου διατηρείται μέχρι το επόμενο. Χωρίς σημεία, ο στόχος είναι παντού το ύψος της κλίμακας."
curve.help.interpTitle: {value: "Ανάμεσα στα σημεία"}

curve.help.lead:
  value: "Ο στόχος κουρδίσματος ορίζει για κάθε νότα πόσο πρέπει να απέχει κάθε καλάμι από το ύψος της κλίμακας. Η καταγεγραμμένη ένδειξη συγκρίνεται με αυτόν τον στόχο. Ο πίνακας κρίνει την ανοχή ως προς τον στόχο σας και όχι ως προς το απόλυτο μηδέν."
curve.help.set:
  value: "Επιλέξτε νότα και τιμή και πατήστε «Ορισμός» ή σύρετε ένα σημείο του γραφήματος πάνω ή κάτω. Κάθε σειρά έχει δική της γραμμή και αυτή που επεξεργάζεστε επισημαίνεται."
curve.help.setTitle: {value: "Ορισμός σημείου"}
curve.helpTitle: {value: "Επιθυμητά διακροτήματα"}
curve.interpolate: {value: "Παρεμβολή"}
curve.interpolateHint: {value: "Ακολουθεί τη γραμμή μεταξύ των σημείων αναφοράς. Όταν είναι ανενεργή, η τιμή κάθε σημείου διατηρείται μέχρι το επόμενο."}
curve.menu.ends: {value: "Πέρα από τα σημεία αναφοράς"}
curve.menu.extendHigh: {value: "Συνέχεια πάνω από το ψηλότερο"}
curve.menu.extendLow: {value: "Συνέχεια κάτω από το χαμηλότερο"}
curve.menu.fit: {value: "Προσαρμογή στις ενδείξεις της συνεδρίας"}

