# Readings table and compact columns
mobile.current: {value: "Μέτρηση"}
mobile.error: {value: "Απόκλιση"}

table.beat:
  value: "Διακρότημα {pair}"
  placeholders:
    pair: {type: string}

table.delete: {value: "Αφαίρεση αυτής της ένδειξης"}
table.deleteHint: {value: "Η ένδειξη θα αφαιρεθεί οριστικά. Για να την αντικαταστήσετε, παίξτε και καταγράψτε ξανά τη νότα."}
table.deleteTitle: {value: "Να αφαιρεθεί αυτή η ένδειξη;"}
table.editHint: {value: "Κάντε κλικ ή πατήστε Enter για επεξεργασία της τιμής"}
