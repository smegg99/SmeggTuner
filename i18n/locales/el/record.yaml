table.graph: {value: "Γράφημα"}

table.graphHint:
  value: "Συγκρίνετε κάθε καλάμι με τον στόχο του. Κάντε κλικ σε μια στήλη για να επιλέξετε τη γραμμή της και ξανά για το επόμενο ρετζίστερ."
table.graphLabel: {value: "Σφάλματα των καλαμιών ανά καταγεγραμμένη νότα"}
table.helpTitle: {value: "Πληροφορίες πίνακα"}
table.label: {value: "Καταγεγραμμένο κούρδισμα"}
table.latest: {value: "Τελευταία καταγραφή: αφαιρείται με Backspace"}
table.manual: {value: "Τροποποιήθηκε"}
table.manualHint: {value: "Μια τιμή αυτής της γραμμής πληκτρολογήθηκε αντί να μετρηθεί από τον ήχο."}

table.notes:
  plural:
    argument: count
    forms:
      one: "{count} νότα"
      other: "{count} νότες"
  placeholders:
    count: {type: integer}

table.unitHint:
  value: "Οι αποκλίσεις των καλαμιών εμφανίζονται στη μονάδα των ρυθμίσεων. Τα διακροτήματα εμφανίζονται σε χερτζ ή στη μονάδα απόκλισης, ανάλογα με την επιλογή στη γραμμή εργαλείων."
