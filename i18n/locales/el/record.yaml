# Recording controls and readings (el).
# Translate value and plural.forms only. Keep keys and {placeholders} unchanged.
# Editing guide: ../../README.md.

# Recording controls
arm.hint: {value: "Οι σταθερές ενδείξεις αποθηκεύονται. Πατήστε εδώ για διακοπή ή πατήστε Enter για άμεση αποθήκευση της τρέχουσας ένδειξης."}
arm.needsSession: {value: "Ανοίξτε συνεδρία για να αποθηκεύσετε μετρήσεις"}
arm.warmup: {value: "Παίξτε ελεύθερα. Πατήστε εδώ όταν θέλετε να αρχίσει η αποθήκευση μετρήσεων."}
undo.hint: {value: "Αναίρεση τελευταίας μέτρησης"}

# Readings table and compact columns
mobile.current: {value: "Μέτρηση"}
mobile.error: {value: "Διαφορά από τον στόχο"}

table.beat:
  value: "Διακρότημα {pair}"
  placeholders:
    pair: {type: string}

table.delete: {value: "Αφαίρεση αυτής της ένδειξης"}
table.deleteHint: {value: "Η ένδειξη θα αφαιρεθεί οριστικά. Για να την αντικαταστήσετε, παίξτε και καταγράψτε ξανά τη νότα."}
table.deleteTitle: {value: "Να αφαιρεθεί αυτή η ένδειξη;"}
table.editHint: {value: "Κάντε κλικ ή πατήστε Enter για επεξεργασία της τιμής"}
table.empty: {value: "Ενεργοποιήστε την καταγραφή μετρήσεων και παίξτε νότες."}
table.graph: {value: "Γράφημα"}

table.graphHint:
  value: "Συγκρίνετε κάθε καλάμι με τον στόχο του. Κάντε κλικ σε μια στήλη για να επιλέξετε τη γραμμή της και ξανά για το επόμενο ρετζίστερ."
table.graphLabel: {value: "Αποκλίσεις των καλαμιών από τις επιθυμητές τιμές ανά καταγεγραμμένη νότα"}
table.helpTitle: {value: "Πληροφορίες πίνακα"}
table.label: {value: "Αποθηκευμένες μετρήσεις κουρδίσματος"}
table.latest: {value: "Τελευταία καταγραφή: αφαιρείται με Backspace"}
table.manual: {value: "Τροποποιήθηκε"}
table.manualHint: {value: "Μια τιμή αυτής της γραμμής καταχωρίστηκε χειροκίνητα."}

table.notes:
  plural:
    argument: count
    forms:
      one: "{count} νότα"
      other: "{count} νότες"
  placeholders:
    count: {type: integer}

table.unitHint:
  value: "Επιλέξτε στις ρυθμίσεις τη μονάδα απόκλισης των καλαμιών. Από τη γραμμή εργαλείων μπορείτε να αλλάξετε τις ενδείξεις διακροτημάτων από χερτζ στην ίδια μονάδα."
