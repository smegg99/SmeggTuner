arm.needsSession: {value: "Ανοίξτε μια συνεδρία για καταγραφή"}
arm.warmup: {value: "Η καταγραφή είναι ανενεργή. Παίξτε ελεύθερα, δεν αποθηκεύεται τίποτα. Πατήστε για έναρξη καταγραφής."}
