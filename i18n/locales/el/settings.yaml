# Sound-card calibration
calibration.askBody:
  value: "Ένα μη βαθμονομημένο ρολόι δειγματοληψίας μπορεί να προκαλέσει μικρό σταθερό σφάλμα μέτρησης. Η βαθμονόμηση διαρκεί περίπου ένα λεπτό και δεν χρειάζεται ήχο."
