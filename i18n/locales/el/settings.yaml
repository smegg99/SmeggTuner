calibration.askContinue: {value: "Συνέχεια χωρίς διόρθωση"}
calibration.askTitle: {value: "Η κάρτα ήχου δεν έχει βαθμονομηθεί"}
calibration.hint: {value: "Αντισταθμίζει την απόκλιση του ρολογιού δειγματοληψίας της κάρτας ήχου. Διαρκεί περίπου ένα λεπτό και δεν χρειάζεται να παίξετε."}
calibration.label: {value: "Βαθμονόμηση κάρτας ήχου"}
calibration.open: {value: "Άνοιγμα"}
calibration.openHint: {value: "Εμφάνιση οθόνης βαθμονόμησης χωρίς έναρξη μέτρησης"}
calibration.saveFailed: {value: "Η βαθμονόμηση δεν αποθηκεύτηκε. Το χορδιστήρι χρησιμοποιεί την προηγούμενη αποθηκευμένη κατάσταση."}
