    path: {type: string}
starting:
  value: "{app} wird gestartet"
  placeholders:
    app: {type: string}
titleCrash: {value: "Die Anwendung wurde unerwartet beendet"}
titleHang: {value: "Die Anwendung reagiert nicht"}
titleHangStopped: {value: "Die Anwendung hat nicht mehr reagiert"}
titleKilled: {value: "Die Anwendung wurde unerwartet geschlossen"}
titleStart: {value: "Die Anwendung konnte nicht gestartet werden"}
wait: {value: "Warten"}
windowCrash: {value: "abgestürzt"}
