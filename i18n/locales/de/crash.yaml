# S99AB startup and crash dialogs (de).
close: {value: "Schließen"}
copied: {value: "Kopiert"}
copy: {value: "Bericht kopieren"}
details: {value: "Details"}
email: {value: "E-Mail mit Bericht vorbereiten"}
failed:
  value: "Vorgang fehlgeschlagen: {error}"
  placeholders:
    error: {type: string}
file:
  value: "Datei: {path}"
  placeholders:
    path: {type: string}
kill: {value: "App beenden und Bericht ansehen"}
logs: {value: "Protokolldatei im Dateimanager zeigen"}
messageConfig:
  value: "Die Einstellungsdatei lässt sich nicht lesen. Korrigiere oder lösche sie und starte {app} neu."
