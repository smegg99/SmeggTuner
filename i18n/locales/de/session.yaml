# Target curve editor
curve.clearAll: {value: "Kurve leeren"}

curve.clearAllConfirm:
  value: "Alle Stützpunkte werden entfernt. Für jeden Ton gilt wieder die Tonhöhe der Skala als Sollwert, und das Stimmgerät dient als einfache Anzeige."
