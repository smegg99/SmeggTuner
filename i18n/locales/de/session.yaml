curve.help.hz:
  value: "Bei Hz wird der Sollwert wie in der Referenz-Schwebungsliste auf A4 = 440 Hz bezogen. Er bleibt unabhängig vom Kammerton der Sitzung. „Aufgezeichnet“ blendet die Messwerte über der Liste ein. Unter „Liste“ lassen sich Stützpunkte daran anpassen oder aus einer anderen Sitzung kopieren."
curve.help.hzTitle: {value: "Hertz und Messwerte"}

curve.help.interp:
  value: "Mit Interpolation folgen die Töne zwischen den Stützpunkten der Linie. Ohne Interpolation gilt jeder Wert bis zum nächsten Punkt. Ohne Stützpunkte entspricht das Ziel überall der Skala."
