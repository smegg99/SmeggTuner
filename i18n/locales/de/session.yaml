curve.help.hz:
  value: "Sollwerte in Hertz beziehen sich immer auf A4 = 440 Hz, unabhängig vom Kammerton der Sitzung. „Messwerte“ zeigt die Messungen der Sitzung im Diagramm. Unter „Liste“ kannst du die Stützpunkte an die Messwerte anpassen oder eine Liste aus einer anderen Sitzung übernehmen."
