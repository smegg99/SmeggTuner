curve.help.lead:
  value: "Das Stimmziel legt für jeden Ton fest, wie weit jede Stimmzunge über oder unter der Skalenfrequenz liegen soll. Die Tabelle zeigt, ob der Messwert innerhalb der Toleranz um diesen Sollwert liegt."
curve.help.set:
  value: "Wähle Ton und Wert und drücke „Setzen“ oder ziehe einen Punkt im Diagramm nach oben oder unten. Jeder Chor hat seine eigene Linie. Die gerade bearbeitete ist hervorgehoben."
