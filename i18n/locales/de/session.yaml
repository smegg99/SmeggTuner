curve.help.lead:
  value: "Das Stimmziel gibt für jeden Ton an, wie weit jede Stimmzunge vom Skalenwert abweichen soll. Die Tabelle bewertet die aufgezeichnete Stimmzunge anhand dieses Ziels und seiner Toleranz."
curve.help.set:
  value: "Wähle Ton und Wert und drücke „Setzen“ oder ziehe einen Punkt im Diagramm nach oben oder unten. Jeder Chor hat seine eigene Linie. Die gerade bearbeitete ist hervorgehoben."
