curve.help.interp:
  value: "Mit Interpolation folgen die Töne zwischen den Stützpunkten der Linie. Ohne Interpolation gilt jeder Wert bis zum nächsten Punkt. Ohne Stützpunkte entspricht das Ziel überall der Skala."
