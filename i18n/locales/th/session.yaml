  value: "เมื่อเลือก Hz ให้ป้อนส่วนต่างที่ต้องการจากระดับเสียงตามบันไดเสียง โดยอิง A4 = 440 Hz ค่านี้ไม่เปลี่ยนตาม A4 ของเซสชัน เลือก “แสดงค่าวัด” เพื่อซ้อนผลวัดบนกราฟ ในเมนู “รายการ” คุณปรับเส้นโค้งให้เข้ากับผลวัดหรือคัดลอกรายการจากเซสชันอื่นได้"
