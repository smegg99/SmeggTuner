curve.help.interpTitle: {value: "ระหว่างจุดกำหนด"}

curve.help.lead:
  value: "เป้าหมายระบุว่าแต่ละลิ้นเสียงควรต่างจากระดับเสียงในบันไดเสียงเท่าไรในแต่ละโน้ต ตารางจะตัดสินค่าที่บันทึกว่าอยู่ในเกณฑ์หรือไม่โดยเทียบกับเป้าหมายนี้ ไม่จำเป็นต้องตรงศูนย์"
