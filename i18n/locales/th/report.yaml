    argument: pluralCount
    forms:
      other: "บีต {pluralCount} คู่"
  placeholders:
    pluralCount: {type: integer}

summary.line:
  value: "{notes} ({min} ถึง {max}), {reeds}, {beats}"
  placeholders:
    beats: {type: string}
    max: {type: string}
    min: {type: string}
    notes: {type: string}
    reeds: {type: string}

summary.notes:
  plural:
    argument: pluralCount
    forms:
      other: "{pluralCount} โน้ต"
  placeholders:
    pluralCount: {type: integer}

summary.out:
  plural:
    argument: pluralCount
    forms:
      other: "นอกช่วงที่ยอมรับได้ {pluralCount} รายการ ({reeds}, {beats})"
  placeholders:
    beats: {type: string}
    pluralCount: {type: integer}
    reeds: {type: string}

summary.reeds:
  plural:
    argument: pluralCount
    forms:
      other: "ค่าลิ้นเสียงที่วัดได้ {pluralCount} ค่า"
  placeholders:
