# Summary and footer
footer.generated:
  value: "สร้างเมื่อ {at} โดย {app}"
  placeholders:
    app: {type: string}
    at: {type: string}

summary.allIn: {value: "ทุกค่าอยู่ในช่วงที่ยอมรับได้"}

summary.beats:
