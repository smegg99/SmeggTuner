# Target curve editor
curve.clearAll: {value: "Limpar curva"}

curve.clearAllConfirm:
  value: "Todos os pontos de ancoragem serão removidos. O alvo voltará à altura da escala para cada nota e o afinador passará a funcionar como um simples indicador."
curve.clearAllHint: {value: "Remover todos os pontos de ancoragem e devolver o alvo à altura da escala."}
curve.clearAllTitle: {value: "Limpar toda a curva?"}
curve.entryUnit: {value: "Unidade de entrada"}

curve.help.hz:
  value: "Em Hz, o alvo usa lá4 = 440 Hz como referência, como na lista de batimentos de referência, por isso não varia com o lá4 da sessão. “Medições gravadas” sobrepõe as medições da sessão à lista. No menu “Lista”, você pode ajustar os pontos de ancoragem a essas medições ou copiar a lista de outra sessão."
curve.help.hzTitle: {value: "Hertz e medições"}

curve.help.interp:
  value: "Com a interpolação ativa, as notas entre os pontos de ancoragem seguem a linha. Com ela desativada, o valor de cada ponto se mantém até o próximo. Sem pontos, o alvo é a altura da escala em todas as notas."
curve.help.interpTitle: {value: "Entre os pontos"}

curve.help.lead:
  value: "Para cada nota, o alvo indica quanto cada palheta deve se desviar da altura da escala. A tabela compara a palheta gravada com esse alvo, em vez do zero, para determinar se ela está dentro da tolerância."
curve.help.set:
  value: "Escolha uma nota e um valor e pressione “Definir”, ou arraste um ponto do gráfico para cima ou para baixo. Cada fileira tem sua própria linha, e a que está sendo editada fica destacada."
curve.help.setTitle: {value: "Definir um ponto"}
curve.helpTitle: {value: "Batimentos desejados"}
curve.interpolate: {value: "Interpolar"}
curve.interpolateHint: {value: "Seguir a linha entre os pontos. Com a opção desativada, o valor de cada ponto se mantém até o próximo."}
