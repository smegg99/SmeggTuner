# S99AB startup and crash dialogs (pt-BR).
close: {value: "Fechar"}
copied: {value: "Copiado"}
copy: {value: "Copiar relatório"}
details: {value: "Detalhes"}
email: {value: "Preparar e-mail com o relatório"}
failed:
  value: "Falha na operação: {error}"
  placeholders:
    error: {type: string}
file:
  value: "Arquivo: {path}"
  placeholders:
    path: {type: string}
kill: {value: "Forçar o encerramento e preparar o relatório"}
logs: {value: "Mostrar o arquivo de log na pasta"}
messageConfig:
  value: "Não foi possível ler o arquivo de configurações. Corrija ou exclua o arquivo e abra o {app} novamente."
  placeholders:
    app: {type: string}
messageCrash:
  value: "O {app} foi encerrado inesperadamente. Você pode compartilhar o relatório com o suporte e reiniciar o aplicativo."
  placeholders:
    app: {type: string}
messageHang: {value: "A operação ainda pode terminar. Você pode aguardar ou fechar o aplicativo para consultar o relatório de diagnóstico."}
messageHangStopped:
  value: "O {app} foi fechado depois que parou de responder. Você pode compartilhar o relatório com o suporte ou reiniciar o aplicativo."
  placeholders:
    app: {type: string}
messageKilled:
  value: "O {app} foi encerrado antes de identificar a causa do problema. Você pode compartilhar os detalhes disponíveis com o suporte ou reiniciar o aplicativo."
  placeholders:
    app: {type: string}
messageOom:
  value: "O sistema ficou sem memória e fechou o {app}. Você pode compartilhar o relatório com o suporte ou reiniciar o aplicativo."
  placeholders:
    app: {type: string}
messageStartup:
  value: "Corrija o problema indicado abaixo e abra o {app} novamente."
  placeholders:
    app: {type: string}
restart: {value: "Reiniciar"}
save: {value: "Salvar relatório"}
saved:
  value: "Salvo em {path}"
  placeholders:
    path: {type: string}
starting:
  value: "Iniciando o {app}"
  placeholders:
    app: {type: string}
titleCrash: {value: "O aplicativo parou inesperadamente"}
titleHang: {value: "O aplicativo não está respondendo"}
titleHangStopped: {value: "O aplicativo parou de responder"}
titleKilled: {value: "O aplicativo foi fechado inesperadamente"}
titleStart: {value: "Não foi possível iniciar o aplicativo"}
wait: {value: "Aguardar"}
windowCrash: {value: "falha do aplicativo"}
windowHang: {value: "não está respondendo"}
windowHangStopped: {value: "parou de responder"}
windowKilled: {value: "fechamento inesperado"}
windowStart: {value: "falha ao iniciar"}
