curve.clearAllTitle: {value: "Išvalyti visą kreivę?"}
curve.entryUnit: {value: "Įvesties vienetai"}

curve.help.hz:
  value: "Pasirinkę Hz tikslą įveskite hercais, kai A4 = 440 Hz, kaip atskaitos plakimų sąraše. Todėl seanso A4 tikslo nekeičia. „Įrašyta“ ant sąrašo uždeda seanso rodmenis. Meniu „Sąrašas“ galite pritaikyti atramos taškus rodmenims arba nukopijuoti kito seanso sąrašą."
curve.help.hzTitle: {value: "Hercai ir rodmenys"}

curve.help.interp:
  value: "Kai įjungta interpoliacija, natos tarp atramos taškų seka liniją; išjungus kiekvieno taško vertė galioja iki kito taško. Be atramos taškų visur siekiama gamos natų aukščio."
curve.help.interpTitle: {value: "Tarp taškų"}

curve.help.lead:
  value: "Derinimo tikslas kiekvienai natai nurodo, kiek kiekvienas liežuvėlis turi nukrypti nuo jos aukščio gamoje. Įrašytas liežuvėlio rodmuo lyginamas su šiuo tikslu. Lentelėje atitiktis vertinama pagal tikslą, o ne pagal nulį."
curve.help.set:
  value: "Pasirinkite natą ir vertę ir spauskite „Nustatyti“ arba vilkite grafiko tašką aukštyn ar žemyn. Kiekvienai eilei skirta atskira linija; keičiama linija paryškinta."
curve.help.setTitle: {value: "Taško nustatymas"}
curve.helpTitle: {value: "Pageidaujami plakimai"}
curve.interpolate: {value: "Interpoliuoti"}
curve.interpolateHint: {value: "Sekti liniją tarp atramos taškų. Išjungus taško vertė galioja iki kito taško."}
