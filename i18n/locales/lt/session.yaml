# Target curve editor
curve.clearAll: {value: "Išvalyti kreivę"}

curve.clearAllConfirm:
  value: "Bus pašalinti visi atramos taškai. Kiekvienos natos tikslu vėl taps jos aukštis gamoje, o derintuvas veiks kaip paprastas indikatorius."
