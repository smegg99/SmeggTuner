# Printed reports and export (lv).
# Translate value and plural.forms only. Keep keys and {placeholders} unchanged.
# Editing guide: ../../README.md.

# Report title and instrument details
facts.curve: {value: "Mērķlīkne"}
facts.curveNone: {value: "nav"}
facts.curveUnnamed: {value: "bez nosaukuma"}
facts.reference: {value: "Atsauces A4 (šis mērījumu cikls)"}
facts.tolerance: {value: "Pielaide"}

facts.toleranceValue:
  value: "Mēlīte {reed} {unit} / pulsācija {beat} {unit}"
  placeholders:
    beat: {type: string}
    reed: {type: string}
    unit: {type: string}

facts.transpose: {value: "Transponēšana"}

facts.transposeValue:
  value: "{key} skan kā {sounds}"
  placeholders:
    key: {type: string}
    sounds: {type: string}

title: {value: "Skaņošanas pārskats"}

# Table and column headings
head.beat:
  value: "Pulsācija {pair}"
  placeholders:
    pair: {type: string}

table.bassTitle:
  value: "Basu skaņošanas tabula ({unit})"
  placeholders:
    unit: {type: string}

table.curr: {value: "Mēr."}
table.err: {value: "Starp."}
table.register: {value: "Reģistrs"}

table.title:
  value: "Skaņošanas tabula ({unit})"
  placeholders:
    unit: {type: string}

# Deviation units
unit.cents.name: {value: "centi"}
unit.cents.symbol: {value: "c"}
unit.reference.name: {value: "0,06 % vienības"}

# Graph legend and reading markers
graph.edited:
  value: "{mark} – labots manuāli."
  placeholders:
    mark: {type: string}

legend.error.cents:
  value: "Vīlējot mēlīti, tuviniet nullei starpību starp mērījumu un mērķvērtību. Izmērītā novirze ir norādīta centos attiecībā pret vienmērīgi temperēto skaņojumu pie A4 = {a4} Hz."
  placeholders:
    a4: {type: string}

legend.error.key: {value: "Starpība = izmērītā vērtība − mērķvērtība."}
legend.error.noCurve: {value: "Ja nav mērķlīknes, mērķvērtība ir nulle. Starpība rāda novirzi no nots augstuma skaņkārtā."}

legend.error.reference:
  value: "Vīlējot mēlīti, tuviniet nullei starpību starp mērījumu un mērķvērtību. Novirzi mēra attiecībā pret vienmērīgi temperēto skaņojumu pie A4 = {a4} Hz. Viena vienība ir 0,06 % no nots frekvences."
  placeholders:
    a4: {type: string}

legend.out.short: {value: "ārpus pielaides"}
legend.takes.key: {value: "xN"}
legend.takes.short: {value: "ierakstīts vairākkārt, redzams pēdējais mērījums"}
mark.edited: {value: "H"}
mark.out: {value: "!"}

# Summary and footer
footer.generated:
  value: "Izveidots {at}, lietotne {app}"
  placeholders:
    app: {type: string}
    at: {type: string}

summary.allIn: {value: "Viss pielaides robežās."}

summary.beats:
  plural:
    argument: pluralCount
    forms:
      zero: "{pluralCount} izmērītu mēlīšu pāru"
      one: "{pluralCount} izmērīts mēlīšu pāris"
      other: "{pluralCount} izmērīti mēlīšu pāri"
  placeholders:
    pluralCount: {type: integer}

summary.line:
  value: "{notes} (no {min} līdz {max}), {reeds}, {beats}."
  placeholders:
    beats: {type: string}
    max: {type: string}
    min: {type: string}
    notes: {type: string}
    reeds: {type: string}

summary.notes:
  plural:
    argument: pluralCount
    forms:
      zero: "{pluralCount} nošu"
      one: "{pluralCount} nots"
      other: "{pluralCount} notis"
  placeholders:
    pluralCount: {type: integer}

summary.out:
  plural:
    argument: pluralCount
    forms:
      zero: "Ārpus pielaides: {pluralCount} ({reeds}, {beats})."
      one: "Ārpus pielaides: {pluralCount} ({reeds}, {beats})."
      other: "Ārpus pielaides: {pluralCount} ({reeds}, {beats})."
  placeholders:
    beats: {type: string}
    pluralCount: {type: integer}
    reeds: {type: string}

summary.reeds:
  plural:
    argument: pluralCount
    forms:
      zero: "{pluralCount} mēlīšu rādījumu"
      one: "{pluralCount} mēlītes rādījums"
      other: "{pluralCount} mēlīšu rādījumi"
  placeholders:
    pluralCount: {type: integer}

summary.reedsShort:
  plural:
    argument: pluralCount
    forms:
      zero: "{pluralCount} mēlīšu"
      one: "{pluralCount} mēlīte"
      other: "{pluralCount} mēlītes"
  placeholders:
    pluralCount: {type: integer}

