# Target curve editor
curve.clearAll: {value: "Notīrīt līkni"}

curve.clearAllConfirm:
  value: "Visi atbalsta punkti tiks noņemti. Katras nots mērķis atkal būs tās augstums skaņkārtā, un skaņotājs darbosies kā vienkāršs indikators."
