curve.clearAllTitle: {value: "Vai notīrīt visu līkni?"}
curve.entryUnit: {value: "Ievades mērvienība"}

curve.help.hz:
  value: "Izvēloties Hz, mērķi ievada hercos pie A4 = 440 Hz, kā pulsāciju atsauces sarakstā, tāpēc tas nemainās līdz ar sesijas A4. “Ierakstīts” pārklāj sarakstu ar sesijas rādījumiem. Izvēlnē “Saraksts” var pielāgot atbalsta punktus rādījumiem vai kopēt citas sesijas sarakstu."
curve.help.hzTitle: {value: "Herci un rādījumi"}

curve.help.interp:
  value: "Ja interpolācija ir ieslēgta, notis starp atbalsta punktiem seko līnijai. Ja tā izslēgta, katra punkta vērtība paliek spēkā līdz nākamajam punktam. Bez punktiem mērķis visur ir skaņkārtas augstums."
curve.help.interpTitle: {value: "Starp punktiem"}

curve.help.lead:
  value: "Skaņošanas mērķis norāda katrai notij, cik tālu katrai mēlītei jānovirzās no skaņkārtas augstuma. Ierakstīto mēlītes rādījumu salīdzina ar šo mērķi. Tabula vērtē atbilstību jūsu mērķim, nevis precīzai nullei."
curve.help.set:
  value: "Izvēlieties noti un vērtību un spiediet “Iestatīt” vai velciet punktu diagrammā uz augšu vai leju. Katrai rindai ir sava līnija, un rediģējamā ir izcelta."
curve.help.setTitle: {value: "Punkta iestatīšana"}
curve.helpTitle: {value: "Vēlamās pulsācijas"}
curve.interpolate: {value: "Interpolēt"}
curve.interpolateHint: {value: "Sekot līnijai starp atbalsta punktiem. Izslēdzot katra punkta vērtība saglabājas līdz nākamajam."}
