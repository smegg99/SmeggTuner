# Target curve editor
curve.clearAll: {value: "Очистить кривую"}

curve.clearAllConfirm: {value: "Все опорные точки будут удалены. Целью для каждой ноты снова станет её высота в звукоряде, а тюнер будет служить простым индикатором."}

curve.clearAllHint: {value: "Удалить все опорные точки и вернуть цель к частоте ноты в звукоряде."}
curve.clearAllTitle: {value: "Очистить всю кривую?"}
curve.entryUnit: {value: "Единица ввода"}

curve.help.hz: {value: "При вводе в герцах целевое отклонение задаётся при A4 = 440 Гц, как в эталонном списке биений. Смена опорной частоты сеанса не меняет заданную цель. Кнопка «Измерения» показывает на графике измерения сеанса. В меню «Список» можно построить по ним кривую или скопировать список из другого сеанса."}

curve.help.hzTitle: {value: "Герцы и показания"}

curve.help.interp: {value: "При включённой интерполяции ноты между опорными точками следуют соединяющей их линии. При выключенной значение каждой точки сохраняется до следующей. Если точек нет, для всех нот целью служит высота в звукоряде."}

curve.help.interpTitle: {value: "Между точками"}

curve.help.lead: {value: "Цель настройки для каждой ноты задаёт, насколько каждый язычок должен отклоняться от высоты в звукоряде. Таблица сравнивает измеренный язычок с вашей целью и по ней определяет, укладывается ли он в допуск. Нулевое отклонение от звукоряда не обязательно является целью."}

curve.help.set: {value: "Выберите ноту и значение и нажмите «Задать» или перетащите точку графика вверх либо вниз. У каждого ряда своя линия. Редактируемый ряд выделен."}

