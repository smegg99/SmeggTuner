# Readings table and compact columns
mobile.current: {value: "Измерено"}
mobile.error: {value: "Отклонение"}

table.beat:
  value: Биения {pair}
  placeholders:
    pair:
      type: string

table.delete: {value: "Удалить это измерение"}
table.deleteHint: {value: "Измерение будет удалено безвозвратно. Чтобы заменить его, снова сыграйте ноту и запишите результат."}
table.deleteTitle: {value: "Удалить это измерение?"}
table.editHint: {value: "Щёлкните или нажмите Enter, чтобы изменить значение"}
table.empty: {value: "Начните запись и сыграйте ноты, чтобы сохранить измерения."}
table.graph: {value: "График"}

table.graphHint: {value: "Сравните каждый язычок с его целевым значением. Щёлкните по столбцу, чтобы выбрать строку, и ещё раз, чтобы выбрать следующий регистр."}

table.graphLabel: {value: "Отклонения язычков для каждой записанной ноты"}
table.helpTitle: {value: "Об этой таблице"}
table.label: {value: "Запись настройки"}
table.latest: {value: "Последняя запись. Для удаления нажмите Backspace"}
table.manual: {value: "Изменено"}
table.manualHint: {value: "Одно из значений в этой строке введено вручную, а не измерено тюнером."}

table.notes:
  plural:
    argument: count
    forms:
      one: '{count} нота'
      few: '{count} ноты'
      many: '{count} нот'
      other: '{count} ноты'
  placeholders:
    count:
      type: integer

table.unitHint: {value: "Отклонения язычков указаны в единицах, выбранных в параметрах. Биения отображаются в герцах или в единицах отклонения в зависимости от выбора на панели инструментов."}

