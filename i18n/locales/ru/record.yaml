# Recording controls and readings (ru).
# Translate value and plural.forms only. Keep keys and {placeholders} unchanged.
# Editing guide: ../../README.md.

# Recording controls
arm.hint: {value: "Записывать измерение при каждой фиксации ноты (Enter запишет его сразу)"}
arm.needsSession: {value: "Для записи откройте сеанс"}
