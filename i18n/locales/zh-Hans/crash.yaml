# S99AB startup and crash dialogs (zh-Hans).
close: {value: "关闭"}
copied: {value: "已复制"}
copy: {value: "复制报告"}
details: {value: "详细信息"}
email: {value: "撰写报告邮件"}
failed:
  value: "操作失败：{error}"
  placeholders:
    error: {type: string}
file:
  value: "文件：{path}"
  placeholders:
    path: {type: string}
kill: {value: "强制退出并生成报告"}
logs: {value: "打开日志文件所在位置"}
messageConfig:
  value: "无法读取设置文件。请修复或删除该文件，然后重新启动 {app}。"
  placeholders:
    app: {type: string}
messageCrash:
  value: "{app} 发生内部错误。请发送报告以便排查问题，然后重新启动应用。"
  placeholders:
    app: {type: string}
messageHang: {value: "应用可能还在处理任务。可以继续等待，也可以强制退出后查看报告，再决定是否发送。"}
messageHangStopped:
  value: "{app} 在无响应时被关闭。请发送报告以便排查问题，然后重新启动应用。"
  placeholders:
    app: {type: string}
messageKilled:
  value: "{app} 在生成报告前被关闭。请发送现有报告以便排查问题，然后重新启动应用。"
  placeholders:
    app: {type: string}
messageOom:
  value: "系统内存不足，已关闭 {app}。请发送报告，然后重新启动应用。"
  placeholders:
    app: {type: string}
messageStartup:
  value: "请解决下方所述的问题，然后重新启动 {app}。"
  placeholders:
    app: {type: string}
restart: {value: "重新启动"}
save: {value: "保存报告"}
saved:
  value: "已保存到 {path}"
  placeholders:
    path: {type: string}
starting:
  value: "正在启动 {app}"
  placeholders:
    app: {type: string}
titleCrash: {value: "应用意外停止运行"}
titleHang: {value: "应用无响应"}
titleHangStopped: {value: "应用已停止响应"}
titleKilled: {value: "应用意外关闭"}
titleStart: {value: "应用无法启动"}
wait: {value: "继续等待"}
windowCrash: {value: "已崩溃"}
windowHang: {value: "无响应"}
windowHangStopped: {value: "已停止响应"}
windowKilled: {value: "已意外关闭"}
windowStart: {value: "无法启动"}
