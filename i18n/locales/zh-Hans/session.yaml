# Target curve editor
curve.clearAll: {value: "清除曲线"}

curve.clearAllConfirm:
  value: "所有锚点都将移除，各簧片的目标音高将恢复为音阶音高。"
curve.clearAllHint: {value: "移除全部锚点，将目标恢复为音阶音高。"}
curve.clearAllTitle: {value: "清除整条曲线？"}
curve.entryUnit: {value: "输入单位"}

curve.help.hz:
  value: "以 Hz 输入的是相对于音阶音高的目标偏差，统一按 A4 = 440 Hz 换算，不随会话的 A4 改变。选择“显示读数”可在图上叠加本会话的测量值。在“列表”中可按读数拟合曲线，或从其他会话复制列表。"
curve.help.hzTitle: {value: "赫兹与读数"}

curve.help.interp:
  value: "启用插值时，锚点之间的音沿连线取值；关闭时，各锚点的值保持到下一锚点。无锚点时，所有音均以音阶音高为目标。"
curve.help.interpTitle: {value: "锚点之间"}

curve.help.lead:
  value: "曲线表示逐音调律的目标，即各簧片应偏离音阶音高多少。表格按此目标判断已记录的簧片是否调准，无需每个读数都归零。"
curve.help.set:
  value: "选择音符和数值后按“设置”，也可上下拖动图中的点。每个簧组各有一条线，正在编辑的线会高亮。"
curve.help.setTitle: {value: "设置锚点"}
curve.helpTitle: {value: "簧片目标偏差与拍频"}
