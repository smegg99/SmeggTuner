# Target curve editor
curve.clearAll: {value: "Cancella curva"}

curve.clearAllConfirm:
  value: "Tutti i punti di ancoraggio verranno rimossi. Per ogni nota l'obiettivo tornerà all'altezza della scala e l'accordatore fungerà da semplice indicatore."
curve.clearAllHint: {value: "Rimuovi tutti i punti di ancoraggio e riporta l'obiettivo all'altezza della scala."}
curve.clearAllTitle: {value: "Cancellare l'intera curva?"}
curve.entryUnit: {value: "Unità di inserimento"}

curve.help.hz:
  value: "In Hz l'obiettivo è riferito a La4 = 440 Hz, come nell'elenco di riferimento dei battimenti, quindi non varia con il La4 della sessione. «Misurazioni registrate» sovrappone le misurazioni della sessione all'elenco. Dal menu «Elenco» puoi adattare i punti di ancoraggio a queste misurazioni o copiare l'elenco di un'altra sessione."
curve.help.hzTitle: {value: "Hertz e misurazioni"}

curve.help.interp:
  value: "Con l'interpolazione attiva, le note tra i punti di ancoraggio seguono la linea. Se è disattivata, ogni punto mantiene il suo valore fino al successivo. Senza punti, l'obiettivo è l'altezza della scala per tutte le note."
curve.help.interpTitle: {value: "Tra i punti"}

curve.help.lead:
  value: "Per ogni nota l'obiettivo indica di quanto ciascuna ancia deve discostarsi dall'altezza della scala. La tabella confronta l'ancia registrata con questo obiettivo, anziché con lo zero, per stabilire se rientra nella tolleranza."
curve.help.set:
  value: "Scegli una nota e un valore e premi «Imposta», oppure trascina un punto del grafico verso l'alto o il basso. Ogni fila ha una propria linea. Quella che stai modificando è evidenziata."
curve.help.setTitle: {value: "Impostare un punto"}
curve.helpTitle: {value: "Battimenti desiderati"}
curve.interpolate: {value: "Interpola"}
curve.interpolateHint: {value: "Segui la linea tra i punti. Se l'opzione è disattivata, ogni punto mantiene il suo valore fino al successivo."}
