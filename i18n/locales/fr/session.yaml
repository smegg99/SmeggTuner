# Target curve editor
curve.clearAll: {value: "Effacer la courbe"}

curve.clearAllConfirm:
  value: "Tous les points d'ancrage seront retirés. La cible reviendra à la hauteur de la gamme pour chaque note et l'accordeur servira de simple indicateur."
curve.clearAllHint: {value: "Retirer tous les points d'ancrage pour ramener chaque cible à la hauteur de la gamme."}
curve.clearAllTitle: {value: "Effacer toute la courbe ?"}
curve.entryUnit: {value: "Unité de saisie"}

curve.help.hz:
  value: "En Hz, la cible est rapportée à la4 = 440 Hz, comme dans la liste de battements de référence. Elle ne varie donc pas avec le la4 de la session. « Mesures enregistrées » superpose les mesures de la session à la liste. Le menu « Liste » permet d'y ajuster les points d'ancrage ou de copier la liste d'une autre session."
curve.help.hzTitle: {value: "Hertz et mesures"}

curve.help.interp:
  value: "Avec l'interpolation, les notes entre deux points d'ancrage suivent la ligne. Sans elle, la valeur de chaque point est maintenue jusqu'au suivant. Sans points, la cible reste à la hauteur de la gamme pour toutes les notes."
curve.help.interpTitle: {value: "Entre les points"}

curve.help.lead:
  value: "Pour chaque note, la cible indique de combien chaque anche doit s'écarter de la hauteur de la gamme. Le tableau détermine si l'anche est dans la tolérance en comparant la mesure à cette cible plutôt qu'au zéro de la gamme."
curve.help.set:
  value: "Choisissez une note et une valeur puis appuyez sur « Définir », ou déplacez un point du graphique vers le haut ou le bas. Chaque rangée a sa propre ligne. La ligne en cours de modification est mise en évidence."
curve.help.setTitle: {value: "Définir un point"}
curve.helpTitle: {value: "Battements souhaités"}
curve.interpolate: {value: "Interpoler"}
curve.interpolateHint: {value: "Suivre la ligne entre les points. Si l'option est désactivée, la valeur de chaque point est maintenue jusqu'au suivant."}
curve.menu.ends: {value: "Au-delà des points d'ancrage"}
curve.menu.extendHigh: {value: "Prolonger au-dessus du point le plus aigu"}
curve.menu.extendLow: {value: "Prolonger au-dessous du point le plus grave"}
