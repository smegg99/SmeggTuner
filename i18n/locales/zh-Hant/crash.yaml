# S99AB startup and crash dialogs (zh-Hant).
close: {value: "關閉"}
copied: {value: "已複製"}
copy: {value: "複製報告"}
details: {value: "詳細資料"}
email: {value: "用郵件程式撰寫回報信"}
failed:
  value: "操作失敗：{error}"
  placeholders:
    error: {type: string}
file:
  value: "檔案：{path}"
  placeholders:
    path: {type: string}
kill: {value: "強制結束並產生報告"}
logs: {value: "開啟記錄檔所在位置"}
messageConfig:
  value: "無法讀取設定檔。請修復或刪除該檔案，然後重新啟動 {app}。"
  placeholders:
    app: {type: string}
messageCrash:
  value: "{app} 發生內部錯誤。請傳送報告以協助排除問題，然後重新啟動程式。"
  placeholders:
    app: {type: string}
messageHang: {value: "程式可能仍在處理工作。可以繼續等候，或強制結束後查看報告，再決定是否寄出。"}
messageHangStopped:
  value: "{app} 在沒有回應時遭到關閉。請傳送報告以協助排除問題，然後重新啟動程式。"
  placeholders:
    app: {type: string}
messageKilled:
  value: "{app} 在產生報告前遭到關閉。請傳送現有的報告以協助排除問題，然後重新啟動程式。"
  placeholders:
    app: {type: string}
messageOom:
  value: "系統記憶體不足，已關閉 {app}。請傳送報告，然後重新啟動程式。"
  placeholders:
    app: {type: string}
messageStartup:
  value: "請先解決下方所述的問題，再重新啟動 {app}。"
  placeholders:
    app: {type: string}
restart: {value: "重新啟動"}
save: {value: "儲存報告"}
saved:
  value: "已儲存至 {path}"
  placeholders:
    path: {type: string}
starting:
  value: "正在啟動 {app}"
  placeholders:
    app: {type: string}
titleCrash: {value: "程式意外停止運作"}
titleHang: {value: "程式沒有回應"}
titleHangStopped: {value: "程式已停止回應"}
titleKilled: {value: "程式意外關閉"}
titleStart: {value: "無法啟動程式"}
wait: {value: "繼續等候"}
windowCrash: {value: "已當機"}
windowHang: {value: "沒有回應"}
windowHangStopped: {value: "已停止回應"}
windowKilled: {value: "已意外關閉"}
windowStart: {value: "無法啟動"}
