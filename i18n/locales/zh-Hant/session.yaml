# Target curve editor
curve.clearAll: {value: "清除曲線"}

curve.clearAllConfirm:
  value: "將移除所有錨點，各簧片的目標音高將恢復為音階音高。"
curve.clearAllHint: {value: "移除全部錨點，將目標恢復為音階音高。"}
curve.clearAllTitle: {value: "清除整條曲線？"}
curve.entryUnit: {value: "輸入單位"}

curve.help.hz:
  value: "以 Hz 輸入的是相對於音階音高的目標偏差，一律按 A4 = 440 Hz 換算，不隨工作階段的 A4 改變。選取「顯示讀數」可在圖上疊加此工作階段的量測值。在「清單」中可依讀數擬合曲線，或從其他工作階段複製清單。"
curve.help.hzTitle: {value: "赫茲與讀數"}

curve.help.interp:
  value: "啟用插值時，錨點之間的音沿連線取值；關閉時，各錨點的值保持到下一錨點。無錨點時，所有音均以音階音高為目標。"
curve.help.interpTitle: {value: "錨點之間"}

curve.help.lead:
  value: "曲線表示逐音調律的目標，即各簧片應偏離音階音高多少。表格按此目標判斷已記錄的簧片是否調準，無需每個讀數都歸零。"
curve.help.set:
  value: "選擇音符和數值後按「設定」，也可上下拖動圖中的點。每個簧組各有一條線，正在編輯的線會高亮。"
curve.help.setTitle: {value: "設定錨點"}
curve.helpTitle: {value: "簧片目標偏差與拍頻"}
curve.interpolate: {value: "插值"}
